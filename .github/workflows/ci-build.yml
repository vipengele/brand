# ci-build — this file is yours.
#
# gt created it once and will never modify or delete it again. Put this
# repository's build steps here; the orchestration around it stays gt's.
#
# Biome gates the tree first — it is both linter and formatter here, and the
# two run before the build so a style failure costs seconds rather than a full
# turbo graph. turbo then builds the project: outlining assets/src into
# dist/svg, then rasterizing dist/svg into dist/png.
#
# This repository holds ONE project (ADR-0015's layout, one entry), so there is
# no change detection and no matrix: every change that reaches CI reaches
# source/brand. react's ci-build computes affected projects because it has
# several; here that machinery would decide the same thing every time.
#
# There is deliberately NO "generated output is up to date" check. Nothing
# generated is committed — dist/ is built by this step and published by
# release.yml — so output cannot disagree with its sources.
#
# It is called by ci-orchestration.yml and must keep `workflow_call`, or the
# orchestrator loses the stage.
name: ci-build

on:
  workflow_call:

# A called workflow may only ever NARROW what its caller grants, never widen
# it — so this block is a ceiling on the whole stage, not a floor.
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/brand
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the pnpm version the project pins in its packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: source/brand/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/brand/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # `--error-on-warnings` (in the lint script) makes a warning fatal, so a
      # rule that only warns is dealt with instead of accumulating unread.
      - run: pnpm lint
      - run: pnpm format:check
      # Outlines the wordmark and rasterizes the published set. A source SVG
      # that names a font weight the outliner has no TTF for fails here.
      - run: pnpm build
